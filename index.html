<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#003f34" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Sanro Doors" />
    <meta name="apple-mobile-web-app-title" content="Sanro Doors" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-startup-image" href="/splash.jpg" />
    <meta name="description" content="Billing and transaction management for Sanro Doors." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Sanro Doors</title>
    <style>
      html,
      body {
        margin: 0;
        background: #003f34;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(165deg, #002922 0%, #003f34 48%, #0b5c4d 100%);
        font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
      }
      #boot-splash img {
        width: 108px;
        height: 108px;
        border-radius: 28px;
        object-fit: cover;
        box-shadow: 0 18px 40px rgb(0 0 0 / 0.28);
      }
      #boot-splash .brand {
        margin: 22px 0 0;
        color: #fff;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      #boot-splash .tag {
        margin: 8px 0 0;
        color: rgb(255 255 255 / 0.55);
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <img src="/icons/icon-192.png" alt="" width="108" height="108" />
      <p class="brand">Sanro Doors</p>
      <p class="tag">Designed to open possibilities</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
